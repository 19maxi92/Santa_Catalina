<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <path id="arcTop" d="M 30,100 A 70,70 0 0 1 170,100" />
    <path id="arcBottom" d="M 30,100 A 70,70 0 0 0 170,100" />
  </defs>

  <!-- Borde ondulado tipo sello -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#b91c3c"
          stroke-width="7" stroke-dasharray="6.5 5.5" stroke-linecap="round" />

  <!-- Fondo del sello -->
  <circle cx="100" cy="100" r="84" fill="#b91c3c" />

  <!-- Anillos finos del marco -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#fff" stroke-width="1.6" opacity="0.9" />
  <circle cx="100" cy="100" r="52" fill="none" stroke="#fff" stroke-width="1.6" opacity="0.9" />

  <!-- Texto curvo -->
  <text font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="13.5"
        fill="#fff" letter-spacing="2.5">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">SANDWICHERÍA</textPath>
  </text>
  <text font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="13.5"
        fill="#fff" letter-spacing="2.5">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">SANTA CATALINA</textPath>
  </text>

  <!-- Puntos decorativos entre los textos -->
  <circle cx="30" cy="100" r="2.4" fill="#fff" />
  <circle cx="170" cy="100" r="2.4" fill="#fff" />

  <!-- Ícono: porción de sandwich triangular -->
  <g transform="translate(100,104)">
    <path d="M -34,20 L 34,20 L -8,-24 Z" fill="#fff" />
    <path d="M -25,10.5 L 20,10.5 L 6,-5.5 L -12,-5.5 Z" fill="#b91c3c" />
    <circle cx="-14" cy="-14" r="1.6" fill="#fff" />
    <circle cx="-4" cy="-19" r="1.6" fill="#fff" />
    <circle cx="6" cy="-13" r="1.6" fill="#fff" />
  </g>
</svg>
